    /* NAV */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:100;
      display:flex; justify-content:space-between; align-items:center;
      padding:18px 40px;
      background:rgba(17,17,17,0.92);
      backdrop-filter:blur(10px);
    }
    nav .logo {
      font-size:15px; font-weight:500; letter-spacing:0.02em; color:#fff;
      text-decoration:none;
    }
    nav .links { display:flex; gap:32px; align-items:center; }
    nav .links a {
      font-size:12px; color:#fff; text-decoration:none;
      letter-spacing:0.1em; text-transform:uppercase;
      opacity:0.6; transition:opacity 0.2s;
    }
    nav .links a:hover { opacity:1; }
    nav .back {
      font-size:12px; color:#fff; text-decoration:none;
      letter-spacing:0.1em; text-transform:uppercase;
      opacity:0.6; transition:opacity 0.2s;
      display:flex; align-items:center; gap:6px;
    }
    nav .back:hover { opacity:1; }

    /* espaço do nav fixo */
    .nav-spacer { height:60px; background:#111; }

    /* VÍDEO — embed Vimeo, full width, responsivo 16:9 */
    .video-wrap {
      position:relative;
      width:100%;
      padding-top:56.25%; /* 16:9 */
      background:#0d0d0d;
      border-bottom:1px solid #1a1a1a;
    }
    .video-wrap iframe {
      position:absolute; inset:0;
      width:100%; height:100%;
      border:none;
    }

    /* FOOTER */
    footer {
      padding:22px 40px;
      display:flex; align-items:center; justify-content:space-between;
      border-top:1px solid #1e1e1e;
      background:#000; position:relative;
    }
    .footer-cta { font-size:15px; color:#fff; letter-spacing:0.02em; }
    .footer-arrows {
      font-size:13px; color:#fff; letter-spacing:0.18em;
      position:absolute; left:50%; transform:translateX(-50%);
    }
    .footer-icons { display:flex; align-items:center; gap:10px; }
    .icon-btn {
      width:34px; height:34px;
      border:1.5px solid #fff; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      color:#fff; text-decoration:none;
      transition:background 0.2s,color 0.2s;
    }
    .icon-btn:hover { background:#fff; color:#000; }
    .icon-btn svg { display:block; }

    /* RESPONSIVE */
    @media(max-width:768px) {
      nav { padding:16px 20px; }
      footer { flex-direction:column; align-items:center; gap:18px; padding:24px 20px; }
      .footer-arrows { position:static; transform:none; }
    }
  </style>
