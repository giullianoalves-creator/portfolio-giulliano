  <script>
    // Dimensões originais das bandeiras na imagem 1920x1080
    const IMG_W = 1920, IMG_H = 1080;
    const FLAGS = {
      pt: { x1:1665, y1:55, x2:1709, y2:102 },
      en: { x1:1716, y1:55, x2:1755, y2:102 }
    };

    function positionFlags() {
      const img = document.getElementById('img-pt').classList.contains('hidden')
        ? document.getElementById('img-en')
        : document.getElementById('img-pt');

      const rect = img.getBoundingClientRect();

      // Calcular área real da imagem dentro do elemento (object-fit:contain)
      const containerW = rect.width;
      const containerH = rect.height;
      const imgRatio = IMG_W / IMG_H;
      const containerRatio = containerW / containerH;

      let renderedW, renderedH, offsetX, offsetY;

      if (imgRatio > containerRatio) {
        // limitado pela largura
        renderedW = containerW;
        renderedH = containerW / imgRatio;
        offsetX = 0;
        offsetY = (containerH - renderedH) / 2;
      } else {
        // limitado pela altura
        renderedH = containerH;
        renderedW = containerH * imgRatio;
        offsetX = (containerW - renderedW) / 2;
        offsetY = 0;
      }

      const scaleX = renderedW / IMG_W;
      const scaleY = renderedH / IMG_H;

      // Posicionar cada bandeira
      Object.keys(FLAGS).forEach(function(lang) {
        const f = FLAGS[lang];
        const el = document.getElementById('flag-' + lang);
        const top  = rect.top  + window.scrollY + offsetY + f.y1 * scaleY;
        const left = rect.left + window.scrollX + offsetX + f.x1 * scaleX;
        const w    = (f.x2 - f.x1) * scaleX;
        const h    = (f.y2 - f.y1) * scaleY;
        el.style.top    = top  + 'px';
        el.style.left   = left + 'px';
        el.style.width  = w    + 'px';
        el.style.height = h    + 'px';
      });
    }

    let currentLang = 'pt';

    function setLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      document.getElementById('img-pt').classList.toggle('hidden', lang !== 'pt');
      document.getElementById('img-en').classList.toggle('hidden', lang !== 'en');
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      positionFlags();
    }

    // Posicionar ao carregar e ao redimensionar
    window.addEventListener('load', positionFlags);
    window.addEventListener('resize', positionFlags);
  </script>
